# Greenhouse local configuration.
# Device inventory is fetched from the remote config service (config.swee.net,
# statehouse_devices namespace) and is NOT defined here. Greenhouse reads NO
# tariffs — it is a climate service, not an energy one.

http:
  listen: ":8082"
  public_url: "https://greenhouse.swee.net"

influx:
  url: "http://garibaldi:8086"
  org: "swee.net"
  bucket: "statehouse"
  # Supply the read token inline, or point token_file at a file containing
  # it (token_file is read only when token is empty). Scope to the statehouse
  # bucket.
  token: ""
  token_file: "/etc/greenhouse/influx-token"

identity:
  base_url: "https://id.swee.net"
  client_id: "greenhouse"
  client_secret: "REPLACE_ME"

remote_config:
  base_url: "https://config.swee.net"

house:
  timezone: "Europe/London"
