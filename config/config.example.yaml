# The property this instance serves.
#
#   id                 the site's id in the `sites` namespace. Reported on /healthz and
#                      named in the startup log; nothing cross-checks it against that
#                      namespace, so a wrong id is visible rather than rejected.
#   devices_namespace  the config namespace holding this site's devices. REQUIRED —
#                      there is no default. The shared `statehouse_devices` document
#                      it once fell back to was deleted from the config service, so
#                      an unset namespace now refuses to start rather than booting
#                      and serving zero devices.
#
# Both are given explicitly. devices_namespace is deliberately not derived from id: a
# namespace is a document that either exists or does not, so guessing `devices_<id>`
# would turn a typo in id into a 404, a fail-open empty snapshot, and every endpoint
# honestly reporting no devices. Setting devices_namespace without an id is legal —
# that config works — but warns, because the instance cannot then report which
# property it serves.
site:
  id: home
  devices_namespace: devices_home

# Greenhouse local configuration.
# Device inventory is fetched from the remote config service (config.swee.net, the
# namespace named by site.devices_namespace above) and is NOT defined here.
# Greenhouse reads NO tariffs — it is a climate service, not an energy one.

http:
  listen: ":8686"
  public_url: "https://greenhouse.swee.net"

influx:
  url: "http://garibaldi:8086"
  org: "swee.net"
  bucket: "statehouse"
  # Supply the read token inline, or point token_file at a file containing
  # it (token_file is read only when token is empty). Scope to the statehouse
  # bucket.
  token: ""
  token_file: "/etc/greenhouse/influx-token"

identity:
  base_url: "https://id.swee.net"
  client_id: "greenhouse"
  client_secret: "REPLACE_ME"

remote_config:
  base_url: "https://config.swee.net"

house:
  timezone: "Europe/London"

auth:
  # Inbound auth is disabled only when identity.base_url is empty. To boot in
  # that unauthenticated state you MUST opt in here — otherwise greenhouse
  # refuses to start, so a missing/typo'd identity.base_url can't silently
  # serve the data API publicly. Leave false in production.
  allow_insecure: false
