openapi: 3.0.3
info:
  title: Greenhouse API
  description: >
    Read-side climate/environment reporting HTTP API. Turns per-sensor
    environmental telemetry (temperature, humidity, pressure, wind, rainfall,
    light, UV) into time-series charts over arbitrary windows. Climate data is
    non-additive: values are bucketed and grouped with mean/min/max/last, never
    summed. All endpoints except /healthz and /openapi.json require a Bearer JWT
    (user or service token) issued by the configured identity service.
  version: "0.2.0"
  contact:
    name: Martin Sweeney
    email: martin@sweeney.io
    url: https://github.com/sweeney/greenhouse
  license:
    name: Proprietary
    url: https://github.com/sweeney/greenhouse
servers:
  - url: __PUBLIC_URL__

security:
  - bearerAuth: []

tags:
  - name: data
    description: Device catalog, climate series, latest readings and field registry (require a Bearer JWT).
  - name: system
    description: Health and API spec endpoints.

paths:
  /healthz:
    get:
      summary: Health check
      description: Returns server health, Influx reachability, and remote config fetch status. No auth required.
      operationId: getHealth
      security: []
      tags: [system]
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /openapi.json:
    get:
      summary: OpenAPI spec
      description: This spec document, as JSON. No auth required.
      operationId: getOpenAPISpec
      security: []
      tags: [system]
      responses:
        "200":
          description: OpenAPI 3.0 spec
          content:
            application/json:
              schema:
                type: object

  /devices:
    get:
      summary: Climate device catalog
      description: >
        Discovery catalog of climate devices from the configured devices
        namespace, each with its room, its declared `floor`,
        and an `environment_fields` hint of the fields it writes to the
        device_environment measurement.

        A device is charted when its class reports environmental telemetry:
        `environmental_sensor` (purpose-built sensors) or `fire_alarm` (the
        installed alarms report temperature_c alongside smoke state, and in some
        rooms they are the ONLY environment source). The `class` is reported
        as-is so a consumer can distinguish the two.

        The hint comes from the device config's explicit `environment_fields`
        list when present; otherwise it falls back to the full field registry,
        which over-advertises — a device whose config omits the key may appear
        to offer fields it never reports. Lets a UI build a device picker
        without knowing Influx. Sorted by id.
      operationId: getDevices
      tags: [data]
      responses:
        "200":
          description: Climate device catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /series:
    get:
      summary: Climate time-series
      description: >
        Multi-series climate time-series over the window for one field: per-series
        values aligned to a shared bucket axis. group_by selects device (default,
        one series per climate sensor) or room (the MEAN of a room's sensors —
        never a sum). field selects the measurement (default temperature_c); fn
        selects the per-bucket aggregation (mean default, min, max, last). The
        shape param chooses columnar (default) or row-oriented output. Empty
        buckets are null (no reading), not zero. Bucket starts are snapped to
        the local-midnight interval grid, so the first bucket of an off-grid
        window (any "<N>h" window, or a non-grid-aligned custom from) begins
        slightly before `from`.
      operationId: getSeries
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Interval"
        - $ref: "#/components/parameters/Field"
        - $ref: "#/components/parameters/Fn"
        - $ref: "#/components/parameters/GroupBy"
        - $ref: "#/components/parameters/Devices"
        - $ref: "#/components/parameters/Rooms"
        - $ref: "#/components/parameters/Floors"
        - $ref: "#/components/parameters/Shape"
      responses:
        "200":
          description: >
            Climate time-series. shape=columns → SeriesResponse (shared buckets
            axis + per-series arrays); shape=rows → RowsResponse (flat rows).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SeriesResponse"
                  - $ref: "#/components/schemas/RowsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"

  /devices/{id}/series:
    get:
      summary: Device climate time-series
      description: >
        Single-device convenience form of /series: the same response shapes
        carrying exactly one series for the device. Non-climate devices return
        400, as does a field the device does not report where its config
        declares environment_fields — this endpoint promises exactly one series,
        so an impossible request is an error rather than an all-null response.
        field/fn/shape otherwise behave as on /series.
      operationId: getDeviceSeries
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Interval"
        - $ref: "#/components/parameters/Field"
        - $ref: "#/components/parameters/Fn"
        - $ref: "#/components/parameters/Shape"
      responses:
        "200":
          description: >
            Climate time-series for the device. shape=columns → SeriesResponse;
            shape=rows → RowsResponse.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SeriesResponse"
                  - $ref: "#/components/schemas/RowsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /devices/{id}/latest:
    get:
      summary: Device latest reading
      description: >
        The device's most recent reading across all the fields it reports, for
        dashboards. Only registered fields are surfaced. Looks back over the last
        7 days (a device silent longer than that returns no reading for the
        field). Non-climate devices return 400.
      operationId: getDeviceLatest
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200":
          description: Latest reading per field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /fields:
    get:
      summary: Field registry
      description: >
        The registry of chartable environmental fields (name, unit, default
        aggregation) so consumers can build field pickers.
      operationId: getFields
      tags: [data]
      responses:
        "200":
          description: Field registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  parameters:
    DeviceID:
      name: id
      in: path
      required: true
      description: Device id (key in the configured devices namespace).
      schema:
        type: string
    Window:
      name: window
      in: query
      required: false
      description: >-
        Window spec. Defaults to "today". Period-to-date: today, week (from
        Monday), month (from the 1st) — all ending now. custom: an explicit
        from/to range. Rolling: "<N>d" is a trailing N calendar days ending now,
        DAY-ALIGNED to local midnight (e.g. 7d = today + the previous 6 days;
        1d == today); "<N>h" is an EXACT trailing N hours (e.g. 24h), not
        midnight-aligned. N is a positive integer; a span over ~2 years returns 400.
      schema:
        type: string
        default: today
        pattern: '^(today|week|month|custom|[0-9]+[dh])$'
        example: 7d
    From:
      name: from
      in: query
      required: false
      description: >
        Custom window start (RFC3339). Valid ONLY with window=custom: required
        when window=custom, and rejected with 400 for any other window —
        period-to-date (today/week/month) and rolling (<N>d/<N>h) derive their
        own range, so it is not silently ignored. The custom span (to - from) may
        not exceed ~2 years (matching Influx retention); a larger span returns 400.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: >
        Custom window end (RFC3339). Valid ONLY with window=custom: required
        when window=custom, and rejected with 400 for any other window —
        period-to-date (today/week/month) and rolling (<N>d/<N>h) derive their
        own range, so it is not silently ignored. The custom span (to - from) may
        not exceed ~2 years (matching Influx retention); a larger span returns 400.
      schema:
        type: string
        format: date-time
    Interval:
      name: interval
      in: query
      required: false
      description: >
        Bucket granularity. Defaults smartly to the window (today→1h,
        week/month→1d, custom and rolling <N>d/<N>h→by span). An interval whose
        bucket count over the window exceeds the ~2500 cap returns 400 asking for
        a coarser interval (the cap admits 5m over a 7-day window, ~2016 buckets).
      schema:
        type: string
        enum: [5m, 15m, 30m, 1h, 6h, 1d]
    Field:
      name: field
      in: query
      required: false
      description: >
        The environmental field to chart. Defaults to temperature_c. An unknown
        field returns 400.

        Per-device coverage is honoured where config declares it
        (environment_fields). On /devices/{id}/series, a field the named device
        does not report is a 400 — the endpoint promises exactly one series, and
        answering with all-null buckets would be indistinguishable from a sensor
        outage. On /series, devices that cannot report the field are simply
        omitted from the result rather than padding it with empty lines; if that
        leaves nothing, the response is an empty 200.

        A device whose config declares no environment_fields is treated as
        unknown coverage and is never rejected or omitted, so a stale namespace
        cannot hide readings that genuinely exist.
      schema:
        type: string
        enum: [temperature_c, humidity_pct, pressure_hpa, wind_speed_ms, wind_dir_deg, rainfall_mm, illuminance_lux, uv_index]
        default: temperature_c
    Fn:
      name: fn
      in: query
      required: false
      description: >
        Per-bucket aggregation. Defaults to the field's default_fn (mean for
        ordinary gauges). Climate is non-additive, so sum is deliberately not
        offered. Circular fields (wind_dir_deg, a 0–360° bearing) accept ONLY
        last — arithmetic mean/min/max are mathematically wrong on an angular
        axis — and default to last; requesting mean/min/max for them returns 400.
      schema:
        type: string
        enum: [mean, min, max, last]
    GroupBy:
      name: group_by
      in: query
      required: false
      description: >
        How to group series. "device" (default) yields one series per climate
        sensor. "room" combines a room's sensors with the MEAN of their readings
        (never a sum).

      schema:
        type: string
        enum: [device, room]
        default: device
    Devices:
      name: devices
      in: query
      required: false
      description: >
        CSV of device ids to chart, e.g.
        devices=sensor_b,sensor_c. Restricts the series to
        those climate sensors; omit for all climate devices. An unknown id, or an
        id that exists but is not a climate sensor, returns 400. Composes with
        `rooms` and `floors` as AND.
      schema:
        type: string
    Rooms:
      name: rooms
      in: query
      required: false
      description: >
        CSV of floorplan room ids to chart, e.g.
        rooms=floor2.room-a,floor3.room-a. The candidate set is
        always climate sensors only, so a non-climate device sharing a room is
        never included; a room with no climate sensor returns 400. Composes with
        `devices` and `floors` as AND.
      schema:
        type: string
    Floors:
      name: floors
      in: query
      required: false
      description: >
        CSV of floors to chart, e.g. floors=floor1,floor2. Selects every climate
        sensor whose declared floor matches — the coarse sibling of `rooms`. The
        candidate set is always climate sensors only; a floor with no climate
        sensor returns 400. A device whose namespace entry declares no floor has
        an unknown floor and is never selected by `floors`. Composes with
        `devices` and `rooms` as AND.
      schema:
        type: string
    Shape:
      name: shape
      in: query
      required: false
      description: >
        Response layout. "columns" (default) is the columnar SeriesResponse — a
        shared `buckets` axis plus per-series value arrays (ideal for web
        charting libraries). "rows" is the row-oriented RowsResponse — a flat
        `rows` list of one object per (series, bucket), idiomatic for Codable
        consumers and grouped native charts (e.g. Swift Charts).
      schema:
        type: string
        enum: [columns, rows]
        default: columns

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid Bearer JWT
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid or missing query parameters, unknown field/fn, or non-climate device
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Unknown device
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream Influx query failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Field:
      type: object
      properties:
        name:
          type: string
          description: Influx _field key (e.g. temperature_c).
        unit:
          type: string
          description: Display unit (e.g. °C, %, hPa).
        default_fn:
          type: string
          description: >
            Default per-bucket aggregation (mean for ordinary gauges; last for
            circular fields like wind_dir_deg).
        circular:
          type: boolean
          description: >
            True for angular 0–360° quantities (wind direction). Circular fields
            accept only fn=last; arithmetic mean/min/max are wrong on an angular
            axis. Omitted (false) for ordinary gauges.
      required: [name, unit, default_fn]

    FieldsResponse:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
      required: [fields]

    Series:
      type: object
      description: >
        One line: a labelled, location-tagged set of per-bucket values (length
        len(buckets)) plus window summary stats. A bucket with no reading is
        null. There are no totals — climate is non-additive.
      properties:
        key:
          type: string
          description: Series identity (device id or room id).
        label:
          type: string
        room:
          type: string
          description: Floorplan room id.
        values:
          type: array
          items:
            type: number
            nullable: true
          description: Per-bucket value (null for an empty bucket), aligned to buckets.
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        mean:
          type: number
          nullable: true
      required: [key, label, values, min, max, mean]

    SeriesResponse:
      type: object
      description: >
        Columnar climate time-series: a shared bucket time axis plus per-series
        value arrays that all align to it, with field/unit/fn metadata.
      properties:
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        interval:
          type: string
          enum: [5m, 15m, 30m, 1h, 6h, 1d]
        group_by:
          type: string
          enum: [device, room]
        field:
          type: string
        unit:
          type: string
        fn:
          type: string
          enum: [mean, min, max, last]
        shape:
          type: string
          enum: [columns]
          description: Always "columns" for this schema.
        buckets:
          type: array
          items:
            type: string
            format: date-time
          description: >
            Local-timezone bucket-start axis every series aligns to. Bucket
            starts are snapped onto the interval grid anchored at local midnight
            (the same grid Influx aggregates on), so each value describes the
            span its bucket is labelled with. For a window whose start is off
            that grid (any "<N>h" window, or a custom from that is not
            grid-aligned) the FIRST bucket start is therefore slightly earlier
            than `from`; that leading slice carries no in-window data.
        series:
          type: array
          items:
            $ref: "#/components/schemas/Series"
      required: [window, from, to, interval, group_by, field, unit, fn, shape, buckets, series]

    SeriesMeta:
      type: object
      description: Per-series metadata for the row-oriented shape (no per-bucket arrays).
      properties:
        key:
          type: string
          description: Series identity (device id or room id).
        label:
          type: string
        room:
          type: string
          description: Floorplan room id.
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        mean:
          type: number
          nullable: true
      required: [key, label, min, max, mean]

    SeriesPoint:
      type: object
      description: One (series, bucket) sample in the row-oriented shape.
      properties:
        key:
          type: string
          description: Series identity this row belongs to.
        time:
          type: string
          format: date-time
          description: Bucket start (local timezone offset).
        value:
          type: number
          nullable: true
          description: The field value for this bucket (null when no reading).
      required: [key, time, value]

    RowsResponse:
      type: object
      description: >
        Row-oriented ("tidy"/long) climate time-series: a flat list of one row
        per (series, bucket), plus lightweight per-series metadata, with
        field/unit/fn metadata. Rows are ordered by series then bucket time.
      properties:
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        interval:
          type: string
          enum: [5m, 15m, 30m, 1h, 6h, 1d]
        group_by:
          type: string
          enum: [device, room]
        field:
          type: string
        unit:
          type: string
        fn:
          type: string
          enum: [mean, min, max, last]
        shape:
          type: string
          enum: [rows]
          description: Always "rows" for this schema.
        series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesMeta"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SeriesPoint"
      required: [window, from, to, interval, group_by, field, unit, fn, shape, series, rows]

    LatestReading:
      type: object
      description: One field's most-recent value for a device.
      properties:
        field:
          type: string
        unit:
          type: string
        value:
          type: number
        time:
          type: string
          format: date-time
      required: [field, unit, value, time]

    LatestResponse:
      type: object
      properties:
        device_id:
          type: string
        readings:
          type: array
          items:
            $ref: "#/components/schemas/LatestReading"
      required: [device_id, readings]

    DeviceCatalogEntry:
      type: object
      description: One climate device catalog row (environmental_sensor or fire_alarm).
      properties:
        id:
          type: string
        display_name:
          type: string
        room:
          type: string
          description: Floorplan room id, "<floor>.<slug>".
        floor:
          type: string
          description: >
            The floor this device sits on, as declared by the devices namespace
            (a first-class property alongside room, never derived from the room
            id). Empty when the namespace declares no floor, which greenhouse
            reports as unknown rather than guessing one.
        class:
          type: string
        environment_fields:
          type: array
          items:
            type: string
          description: >
            Fields this device writes to device_environment, from the config key
            of the same name. Falls back to the full field registry when config
            does not declare it, in which case it may over-advertise.
      required: [id, display_name, room, floor, class, environment_fields]

    DevicesCatalog:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceCatalogEntry"
      required: [devices]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        started_at:
          type: string
          format: date-time
        started_ago:
          type: integer
          description: Seconds since the server started.
        goroutines:
          type: integer
        auth:
          type: string
          enum: [enabled, disabled]
          description: >
            Inbound auth posture. "disabled" means identity.base_url is empty and
            the data API is served unauthenticated (dev, or a misconfiguration) —
            monitoring should alert on it in production.
        influx_reachable:
          type: boolean
        site:
          type: object
          description: >-
            The site config this instance resolved: which property it serves and
            where it reads that property's devices from. Omitted on an instance
            that predates the per-site split, which is not a fault.
          properties:
            id:
              type: string
              example: home
            devices_namespace:
              type: string
              example: devices_home
        remote_config:
          type: object
          description: >-
            Per-namespace status of the most recent remote-config fetch, keyed by
            the namespace actually read. That key is whatever site.devices_namespace
            names (e.g. `devices_home`); it is required and has no default, so the
            key varies per site and per property. A monitor keyed on a literal
            namespace stops matching when a site migrates, and a missing key reads
            as healthy in most check expressions. Alert on the top-level `status`
            field instead, which degrades regardless of the key. Omitted when no
            remote-config fetcher is wired.
          additionalProperties:
            type: object
            properties:
              ok:
                type: boolean
              fetched_at:
                type: string
                format: date-time
              error:
                type: string
      required: [status, started_at, started_ago, goroutines, auth, influx_reachable]
